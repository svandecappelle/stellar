[aliases]
test=pytest

[tool:pytest]
addopts = --verbose -s
python_files = tests/*/*.py

# Le passage a Python 3.12 fait deprecier `datetime.utcnow()`, appele une
# quarantaine de fois entre les modeles et les tests. La suite en produisait
# quarante mille lignes d'avertissement, ou plus rien d'autre ne se voyait.
#
# Tu par choix, pas par negligence : passer aux dates conscientes du fuseau
# change la nature des valeurs stockees — les colonnes sont des `DateTime` naifs,
# et comparer un naif a un conscient leve. C'est une migration entiere, a mener
# d'un bloc, pas un effet de bord d'une mise a jour de dependances.
#
# La regle ne vise que cet avertissement-la : tout autre reste visible.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
