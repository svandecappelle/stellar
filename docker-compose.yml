version: "3.9"

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: stellar
      POSTGRES_USER: stellar
      POSTGRES_PASSWORD: stellar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellar -d stellar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONFIG: docker
      ENV: docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"

volumes:
  postgres_data:
