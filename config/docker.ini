[logging]
name = stellar
level = INFO
gelf = true

[database]
type=postgresql
uri=postgresql://stellar:stellar@db:5432/stellar

[security]
# La cle qui signe les cookies de session.
#
# Trois sources, dans cet ordre : la variable d'environnement
# STELLAR_SECRET_KEY, puis cette ligne, puis — a defaut — une cle tiree au
# hasard a chaque demarrage. Le repli est SUR : il ne coute que des sessions qui
# ne survivent pas a un redemarrage, et le jeton d'appareil du client en rouvre
# une aussitot. Poser une cle stable evite simplement de couper les requetes en
# vol lors d'un redemarrage tournant.
#
# secret_key = <une valeur longue et tiree au hasard, jamais celle-ci>
