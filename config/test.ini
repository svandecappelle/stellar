[logging]
name = stellar
level = INFO
gelf = true

[database]
type=sqlite
uri=sqlite:///

[security]
# Une cle fixe pour la suite : sans elle, chaque application de test en tire une
# et le journal se remplit de l'avertissement qui va avec. Ce fichier n'est pas
# utilisable en production — sa base est un fichier SQLite.
secret_key = cle-de-test-sans-valeur-ailleurs

# Uniquement pour la suite de tests. Quatre cent dix-sept tests qui creent
# chacun un compte payaient quarante-six secondes de scrypt. La production
# n'a pas cette ligne et prend le defaut de werkzeug — voir app/security.py.
password_method = pbkdf2:sha256:1
